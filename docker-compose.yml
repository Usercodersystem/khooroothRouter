services:
  khoorooth:
    build: .
    container_name: khoorooth-router
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      HOST: ":20128"
      DATA_DIR: /data
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      REQUIRE_API_KEY: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    volumes:
      - ./data:/data
    mem_limit: 128m
    cpus: 1.0
